<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hisab Jumali</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::selection{background:transparent}

body{
    font-family:'Amiri',serif;
    min-height:100vh;
    margin:0;
    padding:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#1f2933,#0b0f14 70%);
    color:#fff;
}

.wrapper{
    width:100%;
    max-width:420px;
}

.container{
    padding:28px 26px;
    text-align:center;
    border-radius:20px;
    background:rgba(30,30,30,.75);
    backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    transform:scale(.95);
    opacity:0;
    transition:transform .6s cubic-bezier(.22,.61,.36,1),opacity .6s ease;
}

.container.show{
    transform:scale(1);
    opacity:1;
}

h2{
    margin:0 0 22px;
    font-size:28px;
    color:#00e676;
    text-shadow:0 0 6px rgba(0,230,118,.7);
}

input{
    width:100%;
    padding:15px;
    font-size:22px;
    border-radius:14px;
    border:none;
    outline:none;
    background:#2a2a2a;
    color:#fff;
    direction:rtl;
    text-align:right;
    transition:
        opacity .45s ease,
        transform .45s ease,
        filter .45s ease,
        box-shadow .45s ease;
}
input::placeholder{color:#aaa}

input.clearing{
    opacity:0;
    transform:scale(.92) translateY(8px);
    filter:blur(5px);
    box-shadow:0 0 12px rgba(0,230,118,.3) inset;
}

.button-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}

button{
    padding:14px;
    font-size:17px;
    font-weight:bold;
    border:none;
    border-radius:14px;
    cursor:pointer;
    transition:.25s ease;
}

.btn-calc{
    background:linear-gradient(135deg,#00e676,#00c853);
    color:#000;
}
.btn-calc:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 0 22px rgba(0,230,118,.6);
}

.btn-clear{
    background:#2f2f2f;
    color:#fff;
}
.btn-clear:hover{
    background:#3a3a3a;
    box-shadow:0 0 12px rgba(0,255,118,.25);
}

.result{
    margin-top:22px;
    font-size:22px;
    font-weight:bold;
    color:#00e676;
    text-shadow:0 0 6px rgba(0,230,118,.5);
    transition:
        opacity .5s ease,
        transform .5s ease,
        filter .5s ease;
}

.result.clearing{
    opacity:0;
    transform:translateY(14px) scale(.92);
    filter:blur(3px);
}

.explanation{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    direction:rtl;
}

.cell{
    background:#1f1f1f;
    border-radius:12px;
    padding:10px 6px;
    text-align:center;
    opacity:0;
    transform:translateY(16px) scale(.9);
    box-shadow:0 0 4px rgba(0,255,118,.2);
    animation:cellIn .7s cubic-bezier(.22,.61,.36,1) forwards;
}
.cell span{
    display:block;
    font-size:20px;
    color:#00e676;
    text-shadow:0 0 4px rgba(0,230,118,.6);
}
.cell small{
    font-size:14px;
    color:#ccc;
}

.cell.clearing{
    animation:cellOut .5s cubic-bezier(.4,0,.2,1) forwards;
}

@keyframes cellIn{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
        box-shadow:0 0 10px rgba(0,230,118,.25);
    }
}

@keyframes cellOut{
    to{
        opacity:0;
        transform:translateY(20px) scale(.88);
        filter:blur(4px);
        box-shadow:0 0 0 rgba(0,230,118,0);
    }
}

@media(max-width:360px){
    .explanation{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<div class="wrapper">
<div class="container" id="calculator">
<h2>Hisab Jumali</h2>

<input id="inputText" type="text" placeholder="Ketik disini">

<div class="button-group">
<button class="btn-calc" onclick="calculate()">Hitung</button>
<button class="btn-clear" onclick="clearAll()">Hapus</button>
</div>

<div class="result" id="result"></div>
<div class="explanation" id="explanation"></div>
</div>
</div>

<script>
const abjadValues={
 'أ':1,'ا':1,'ء':1,'إ':1,'ؤ':1,'ئ':1,'ى':1,
 'ب':2,'ج':3,'د':4,'ه':5,'و':6,'ز':7,'ح':8,'ط':9,'ي':10,
 'ك':20,'ل':30,'م':40,'ن':50,'س':60,'ع':70,'ف':80,'ص':90,'ق':100,
 'ر':200,'ش':300,'ت':400,'ة':400,'ث':500,'خ':600,'ذ':700,
 'ض':800,'ظ':900,'غ':1000
};

function normalizeArabic(t){return t.replace(/[\u064B-\u065F]/g,'')}

function animateNumber(el,target){
    let duration=1000;
    let stepTime=16;
    let steps=Math.ceil(duration/stepTime);
    let n=0;
    const stepValue=target/steps;
    const timer=setInterval(()=>{
        n+=stepValue;
        if(n>=target){n=target;clearInterval(timer)}
        el.textContent=`النتيجة: ${Math.floor(n)}`;
    },stepTime);
}

function calculate(){
    let input=normalizeArabic(inputText.value.trim());
    let sum=0;
    explanation.innerHTML="";
    result.textContent="";

    [...input].forEach((c,i)=>{
        if(abjadValues[c]){
            sum+=abjadValues[c];
            const cell=document.createElement("div");
            cell.className="cell";
            cell.style.animationDelay=`${i*120}ms`;
            cell.innerHTML=`<span>${c}</span><small>${abjadValues[c]}</small>`;
            explanation.appendChild(cell);
        }
    });

    sum>0 ? animateNumber(result,sum) : result.textContent="❌ tidak ada hasil";
}

function clearAll(){
    inputText.classList.add("clearing");
    result.classList.add("clearing");
    [...document.querySelectorAll(".cell")].forEach((c,i)=>{
        c.style.animationDelay=`${i*80}ms`;
        c.classList.add("clearing");
    });

    const container = document.getElementById('calculator');
    container.classList.remove('show');

    setTimeout(()=>{
        inputText.value="";
        result.textContent="";
        explanation.innerHTML="";
        inputText.classList.remove("clearing");
        result.classList.remove("clearing");
        container.classList.add('show');
        inputText.focus();
    },700);
}

inputText.addEventListener("keydown",e=>{
    if(e.key==="Enter") calculate();
});

window.addEventListener('load',()=>{document.getElementById('calculator').classList.add('show');});
</script>

</body>
</html>
